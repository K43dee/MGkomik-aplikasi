<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="'Segoe UI', -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c12"/>
      <stop offset="0.55" stop-color="#16101f"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="0.5" stop-color="#af52de"/>
      <stop offset="1" stop-color="#00e5ff"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="960" height="320" fill="url(#bg)"/>

  <!-- soft glow behind the title -->
  <ellipse cx="480" cy="150" rx="330" ry="150" fill="#ff2d55" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- expanding pulse rings -->
  <circle cx="480" cy="152" r="90" fill="none" stroke="#ff2d55" stroke-width="2" opacity="0">
    <animate attributeName="r" values="90;230" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="152" r="90" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="90;230" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="152" r="90" fill="none" stroke="#af52de" stroke-width="2" opacity="0">
    <animate attributeName="r" values="90;230" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3.2s" begin="-2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- brand -->
  <text x="480" y="180" text-anchor="middle" font-size="92" font-weight="800" fill="url(#brandText)" letter-spacing="3">MGKomik</text>

  <!-- tagline -->
  <text x="480" y="228" text-anchor="middle" font-size="17" font-weight="600" fill="#b9b9d4" letter-spacing="7">
    BACA KOMIK &#8226; SIMPAN CBZ &#8226; BACA OFFLINE
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- loading dots -->
  <circle cx="452" cy="258" r="5" fill="#ff2d55">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="-0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="258" r="5" fill="#af52de">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="-0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="508" cy="258" r="5" fill="#00e5ff">
    <animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- subtle top & bottom edge lines -->
  <rect x="0" y="0" width="960" height="4" fill="url(#brandText)" opacity="0.85"/>
  <rect x="0" y="316" width="960" height="4" fill="url(#brandText)" opacity="0.85"/>
</svg>
